<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Product Catalog Capstone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Modern Store</h1>
        <div class="cart-status">🛒 Cart: <span id="cart-count">0</span> items</div>
    </header>

    <main class="container">
        <aside class="sidebar">
            <h3>Filter Products</h3>
            <button class="filter-btn active" data-category="all">All Items</button>
            <button class="filter-btn" data-category="electronics">Electronics</button>
            <button class="filter-btn" data-category="fashion">Fashion</button>
        </aside>

        <section class="products-grid" id="products-grid">
            <!-- Products rendered dynamically -->
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
